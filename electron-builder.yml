appId: com.peixotolabs.nestwright
productName: Nestwright
directories:
  output: release
asar: true
files:
  - dist/**
  - dist-electron/**
  - package.json
asarUnpack:
  - node_modules/steamworks.js/**
extraResources:
  - from: dist-electron/steam-resources
    to: .
    filter:
      - steam_appid.txt
  # Content pack (npm run content:fetch). Skipped when absent: the game falls back to procedural.
  - from: public/content
    to: content
  # KTX2 transcoder; file:// pages cannot fetch it from the asar, nwcontent://basis/ serves it.
  - from: node_modules/three/examples/jsm/libs/basis
    to: basis
    filter:
      - basis_transcoder.js
      - basis_transcoder.wasm
mac:
  icon: build/icon.icns
  hardenedRuntime: false
  identity: null
  category: public.app-category.games
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
